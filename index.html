
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyMoney - สมุดรายวันทั่วไป</title>

<style>
:root {
  --bg: #090d0b;
  --panel: #101713;
  --panel2: #141e18;
  --line: #26372d;
  --green: #16a36a;
  --green-light: #39d994;
  --text: #e8f0eb;
  --muted: #91a198;
  --gold: #c5ad75;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Tahoma, sans-serif;
  font-size: 14px;
}

button, input, select { font: inherit; }

.app {
  width: 100%;
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 25px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 700;
}

.brand-mark {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--green);
  color: white;
  font-weight: 800;
}

.page-title {
  margin-bottom: 5px;
  font-size: 23px;
  font-weight: 700;
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
}

.toolbar {
  display: flex;
  gap: 9px;
  margin: 20px 0;
}

.search {
  flex: 1;
  min-width: 0;
  height: 42px;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 8px;
  outline: none;
  background: var(--panel);
  color: var(--text);
}

.search:focus {
  border-color: var(--green);
}

.filter {
  height: 42px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.summary-item {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--panel);
}

.summary-label {
  color: var(--muted);
  font-size: 11px;
}

.summary-value {
  margin-top: 7px;
  font-size: 19px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.green { color: var(--green-light); }
.gold { color: var(--gold); }

.journal {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
}

.journal-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  border-bottom: 1px solid var(--line);
  font-weight: 700;
}

.entry {
  border-bottom: 1px solid var(--line);
}

.entry:last-child { border-bottom: 0; }

.entry-header {
  display: grid;
  grid-template-columns: 105px 130px 1fr;
  gap: 10px;
  align-items: center;
  padding: 12px 15px;
  background: var(--panel2);
  border-bottom: 1px solid var(--line);
}

.entry-date {
  color: var(--muted);
  font-size: 12px;
}

.entry-no {
  color: var(--green-light);
  font-weight: 700;
  font-size: 12px;
}

.entry-type {
  justify-self: end;
  color: var(--gold);
  font-size: 11px;
}

.column-head,
.account-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 135px 135px;
  gap: 10px;
  align-items: center;
  padding: 10px 15px;
}

.column-head {
  color: var(--muted);
  font-size: 11px;
  border-bottom: 1px solid var(--line);
}

.account-row {
  min-height: 43px;
  border-bottom: 1px solid rgba(38,55,45,.55);
}

.account-name {
  font-weight: 500;
}

.amount {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.amount.empty { color: #526158; }

.entry-description {
  padding: 11px 15px;
  color: var(--muted);
  font-size: 12px;
  border-top: 1px dashed var(--line);
}

.entry-description strong {
  color: var(--text);
  font-weight: 500;
}

.entry-total {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 135px 135px;
  gap: 10px;
  padding: 12px 15px;
  background: rgba(22,163,106,.07);
  font-weight: 700;
  border-top: 1px solid var(--line);
}

.footer-total {
  display: flex;
  justify-content: flex-end;
  gap: 30px;
  padding: 17px 15px;
  background: #0d1711;
  border-top: 1px solid var(--green);
  font-weight: 700;
}

.footer-total span {
  color: var(--green-light);
  font-variant-numeric: tabular-nums;
}

.empty-state {
  padding: 35px 15px;
  text-align: center;
  color: var(--muted);
}

/* MOBILE */
@media (max-width: 600px) {
  .app { padding: 14px 12px 30px; }

  .topbar { margin-bottom: 22px; }

  .page-title { font-size: 20px; }

  .toolbar {
    flex-direction: column;
    gap: 8px;
  }

  .search, .filter { width: 100%; }

  .summary { gap: 7px; }

  .summary-item { padding: 11px 9px; }

  .summary-label { font-size: 10px; }

  .summary-value { font-size: 15px; }

  .journal-heading {
    padding: 13px 12px;
    font-size: 13px;
  }

  .entry-header {
    grid-template-columns: 1fr auto;
    gap: 5px;
    padding: 12px;
  }

  .entry-date { grid-column: 1; }
  .entry-no { grid-column: 1; }
  .entry-type {
    grid-column: 2;
    grid-row: 1 / span 2;
  }

  
  /* สมุดรายวันบนมือถือ: 3 คอลัมน์เหมือนรูปแบบบัญชีจริง */
  .account-row,
  .column-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 78px 78px;
    gap: 6px;
    align-items: center;
    padding: 10px 9px;
  }

  .column-head {
    display: grid;
    font-size: 10px;
  }

  .account-name {
    min-width: 0;
    font-size: 12px;
    overflow-wrap: anywhere;
  }

  .amount {
    display: block;
    min-width: 0;
    text-align: right;
    white-space: nowrap;
    font-size: 11px;
    padding: 0;
  }

  .amount::before {
    content: none !important;
  }


  
.entry-total {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 78px 78px;
  gap: 6px;
  align-items: center;
  padding: 12px 9px;
  font-size: 11px;
}

.entry-total .total-value {
  display: block;
  min-width: 0;
  text-align: right;
  white-space: nowrap;
}

.entry-total .total-value::before {
  content: none !important;
}

  .footer-total {
    justify-content: space-between;
    gap: 10px;
    padding: 14px 12px;
    font-size: 12px;
  }
}
</style>
</head>

<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">M</div>
      <span>MyMoney</span>
    </div>
    <div class="subtitle">ACCOUNTING SYSTEM</div>
  </header>

  <section>
    <div class="page-title">สมุดรายวันทั่วไป</div>
    <div class="subtitle">GENERAL JOURNAL · บัญชีรายวัน</div>
  </section>

  <div class="summary">
    <div class="summary-item">
      <div class="summary-label">เอกสารทั้งหมด</div>
      <div class="summary-value" id="docCount">0</div>
    </div>
    <div class="summary-item">
      <div class="summary-label">ยอดเดบิต</div>
      <div class="summary-value green" id="debitSum">0.00</div>
    </div>
    <div class="summary-item">
      <div class="summary-label">ยอดเครดิต</div>
      <div class="summary-value gold" id="creditSum">0.00</div>
    </div>
  </div>

  <div class="toolbar">
    <input
      class="search"
      id="search"
      type="search"
      placeholder="ค้นหาเลขที่เอกสาร หรือชื่อบัญชี..."
    >
    <select class="filter" id="typeFilter">
      <option value="ทั้งหมด">เอกสารทั้งหมด</option>
      <option value="รายจ่าย">รายจ่าย</option>
      <option value="รายรับ">รายรับ</option>
      <option value="โอนเงิน">โอนเงิน</option>
      <option value="ปรับปรุง">ปรับปรุง</option>
    </select>
  </div>

  <main class="journal">
    <div class="journal-heading">
      <span>รายการบันทึกบัญชี</span>
      <span class="subtitle">พ.ศ. 2569</span>
    </div>

    <div id="journalList"></div>

    <div class="footer-total">
      <div>รวมทั้งสิ้น</div>
      <div>เดบิต <span id="grandDebit">0.00</span></div>
      <div>เครดิต <span id="grandCredit">0.00</span></div>
    </div>
  </main>

</div>

<script>
const journalData = [
  {
    date: "14/11/2569",
    no: "JV-2569-001",
    type: "รายจ่าย",
    description: "ซื้ออุปกรณ์สำนักงาน",
    lines: [
      { account: "วัสดุสำนักงาน", debit: 3210, credit: 0 },
      { account: "เงินฝากธนาคาร", debit: 0, credit: 3210 }
    ]
  },
  {
    date: "13/11/2569",
    no: "JV-2569-002",
    type: "รายรับ",
    description: "รับชำระค่าบริการจากลูกค้า",
    lines: [
      { account: "เงินฝากธนาคาร", debit: 5350, credit: 0 },
      { account: "รายได้ค่าบริการ", debit: 0, credit: 5350 }
    ]
  },
  {
    date: "12/11/2569",
    no: "JV-2569-003",
    type: "โอนเงิน",
    description: "โอนเงินระหว่างบัญชีธนาคาร",
    lines: [
      { account: "เงินฝากธนาคาร - บัญชีปลายทาง", debit: 10000, credit: 0 },
      { account: "เงินฝากธนาคาร - บัญชีต้นทาง", debit: 0, credit: 10000 }
    ]
  },
  {
    date: "10/11/2569",
    no: "JV-2569-004",
    type: "ปรับปรุง",
    description: "บันทึกค่าใช้จ่ายค้างจ่าย",
    lines: [
      { account: "ค่าใช้จ่ายค้างจ่าย", debit: 2500, credit: 0 },
      { account: "เจ้าหนี้ค้างจ่าย", debit: 0, credit: 2500 }
    ]
  }
];

const money = value =>
  Number(value).toLocaleString("th-TH", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

function renderJournal() {
  const search = document.getElementById("search").value
    .trim().toLowerCase();

  const type = document.getElementById("typeFilter").value;

  const filtered = journalData.filter(doc => {
    const text = [
      doc.no,
      doc.description,
      ...doc.lines.map(line => line.account)
    ].join(" ").toLowerCase();

    return text.includes(search) &&
      (type === "ทั้งหมด" || doc.type === type);
  });

  let html = "";
  let totalDebit = 0;
  let totalCredit = 0;

  filtered.forEach(doc => {
    let debit = 0;
    let credit = 0;

    const rows = doc.lines.map(line => {
      debit += line.debit;
      credit += line.credit;

      return `
        <div class="account-row">
          <div class="account-name">${line.account}</div>
          <div class="amount debit ${line.debit ? "" : "empty"}">
            ${line.debit ? money(line.debit) : "-"}
          </div>
          <div class="amount credit ${line.credit ? "" : "empty"}">
            ${line.credit ? money(line.credit) : "-"}
          </div>
        </div>
      `;
    }).join("");

    totalDebit += debit;
    totalCredit += credit;

    html += `
      <section class="entry">
        <div class="entry-header">
          <div class="entry-date">${doc.date}</div>
          <div class="entry-no">${doc.no}</div>
          <div class="entry-type">${doc.type}</div>
        </div>

        <div class="column-head">
          <div>รายการบัญชี</div>
          <div class="amount">เดบิต</div>
          <div class="amount">เครดิต</div>
        </div>

        ${rows}

        <div class="entry-description">
          คำอธิบายรายการ: <strong>${doc.description}</strong>
        </div>

        <div class="entry-total">
          <div>รวมเอกสาร</div>
          <div class="total-value total-debit">${money(debit)}</div>
          <div class="total-value total-credit">${money(credit)}</div>
        </div>
      </section>
    `;
  });

  document.getElementById("journalList").innerHTML =
    html || `<div class="empty-state">ไม่พบรายการบัญชี</div>`;

  document.getElementById("docCount").textContent = filtered.length;
  document.getElementById("debitSum").textContent = money(totalDebit);
  document.getElementById("creditSum").textContent = money(totalCredit);
  document.getElementById("grandDebit").textContent = money(totalDebit);
  document.getElementById("grandCredit").textContent = money(totalCredit);
}

document.getElementById("search").addEventListener("input", renderJournal);
document.getElementById("typeFilter").addEventListener("change", renderJournal);

renderJournal();
</script>
</body>
</html>
